<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="music-player">
            <div class="header">
                <h1>Music Player</h1>
            </div>
            
            <div class="album-art">
                <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&h=300&fit=crop" alt="Album Art" id="album-art">
            </div>
            
            <div class="song-info">
                <h2 id="song-title">Song Title</h2>
                <p id="artist-name">Artist Name</p>
            </div>
            
            <div class="progress-container">
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn" id="prev-btn">
                    <i class="fas fa-backward"></i>
                </button>
                <button class="control-btn play-btn" id="play-btn">
                    <i class="fas fa-play" id="play-icon"></i>
                </button>
                <button class="control-btn" id="next-btn">
                    <i class="fas fa-forward"></i>
                </button>
            </div>
            
            <div class="volume-control">
                <i class="fas fa-volume-up" id="volume-icon"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
            </div>
            
            <div class="playlist-container">
                <h3>Playlist <i class="fas fa-list" id="playlist-toggle"></i></h3>
                <div class="playlist" id="playlist">
                    <div class="playlist-item active" data-index="0">Song 1 - Artist 1</div>
                    <div class="playlist-item" data-index="1">Song 2 - Artist 2</div>
                    <div class="playlist-item" data-index="2">Song 3 - Artist 3</div>
                    <div class="playlist-item" data-index="3">Song 4 - Artist 4</div>
                </div>
            </div>
            
            <div class="extra-controls">
                <label class="autoplay-label">
                    <input type="checkbox" id="autoplay-toggle"> Autoplay
                </label>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
